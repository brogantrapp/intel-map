name: Update Risk Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-risk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: node scraper.js

      - name: Commit updated risk.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/risk.json

          git commit -m "Auto update risk data" || echo "No changes"

          git push
