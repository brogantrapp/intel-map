name: Update Risk JSON Daily

on:
  schedule:
    - cron: "0 12 * * *"   # once per day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Fetch travel advisory data
        run: |
          curl -s "https://travel.state.gov/content/travel/en/traveladvisories/traveladvisories.json" > raw.json

      - name: Generate risk.json
        run: |
          node -e "
          const fs = require('fs');

          let raw = {};

          try {
            raw = JSON.parse(fs.readFileSync('raw.json', 'utf8'));
          } catch (e) {
            console.log('Failed to parse raw JSON');
            process.exit(1);
          }

          const list =
            raw.data ||
            raw.advisories ||
            raw.countries ||
            [];

          const risk = {};

          const normalize = (s) =>
            (s || '')
              .toString()
              .toLowerCase()
              .trim();

          list.forEach(item => {

            const country =
              item.country ||
              item.name ||
              item.country_name;

            const level =
              item.advisoryLevel ||
              item.level ||
              item.risk_level;

            if (!country || !level) return;

            const key = country.trim();

            const val = Number(level);

            if (val >= 1 && val <= 4) {
              risk[key] = val;
            }
          });

          fs.mkdirSync('data', { recursive: true });

          fs.writeFileSync(
            'data/risk.json',
            JSON.stringify(risk, null, 2)
          );

          console.log('Generated risk.json:', risk);
          "
      
      - name: Commit and push changes
        run: |
          git config --global user.name "risk-bot"
          git config --global user.email "bot@users.noreply.github.com"

          git add data/risk.json

          git commit -m "auto-update risk data" || echo "no changes"

          git push
