name: Build Global Risk Map

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build full world risk.json
        run: |
          node -e "
          const fs = require('fs');

          async function run() {

            // -----------------------------
            // 1. LOAD WORLD GEOJSON (SOURCE OF TRUTH)
            // -----------------------------
            const geo = await fetch(
              'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json'
            ).then(r => r.json());

            const risk = {};

            // EVERY COUNTRY DEFAULTS TO SAFE (LEVEL 1)
            geo.features.forEach(f => {
              const name = f.properties.name;
              if (name) risk[name] = 1;
            });

            console.log('Countries loaded:', Object.keys(risk).length);

            // -----------------------------
            // 2. LOAD STATE DEPT DATA
            // -----------------------------
            let raw = {};

            try {
              raw = JSON.parse(fs.readFileSync('raw.json', 'utf8'));
            } catch (e) {
              console.log('⚠️ State Dept data missing or invalid');
            }

            const list =
              raw.data ||
              raw.advisories ||
              raw.countries ||
              [];

            // -----------------------------
            // 3. APPLY OVERRIDES
            // -----------------------------
            const normalize = s =>
              (s || '')
                .toString()
                .trim();

            list.forEach(item => {

              const country =
                item.country ||
                item.name ||
                item.country_name;

              const level =
                item.advisoryLevel ||
                item.level ||
                item.risk_level;

              if (!country || !level) return;

              const name = normalize(country);

              if (risk[name] !== undefined) {
                risk[name] = Number(level);
              }
            });

            // -----------------------------
            // 4. WRITE OUTPUT
            // -----------------------------
            fs.mkdirSync('data', { recursive: true });

            fs.writeFileSync(
              'data/risk.json',
              JSON.stringify(risk, null, 2)
            );

            console.log('✅ Global risk map built');
          }

          run();
          "
      
      - name: Commit changes
        run: |
          git config --global user.name "risk-bot"
          git config --global user.email "bot@users.noreply.github.com"

          git add data/risk.json
          git commit -m "update global risk map" || echo "no changes"
          git push
