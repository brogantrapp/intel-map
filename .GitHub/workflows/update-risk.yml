import fs from "fs";

const BASE_URL =
  "https://travel.state.gov/content/travel/en/traveladvisories/traveladvisories.html";

function norm(s) {
  return (s || "").toLowerCase().trim();
}

function levelFromText(text) {
  if (!text) return null;

  if (text.includes("Level 4")) return 4;
  if (text.includes("Level 3")) return 3;
  if (text.includes("Level 2")) return 2;
  if (text.includes("Level 1")) return 1;

  return null;
}

// simple HTML fetch helper
async function fetchHTML(url) {
  const res = await fetch(url);
  return await res.text();
}

async function scrapeAdvisories() {

  const html = await fetchHTML(BASE_URL);

  // extract links to country pages
  const regex = /href="(\/content\/travel\/en\/traveladvisories\/traveladvisories\/.*?\.html)"/g;

  const matches = [...html.matchAll(regex)];

  const links = [...new Set(matches.map(m => m[1]))];

  const risk = {};

  for (const link of links) {

    try {
      const url = "https://travel.state.gov" + link;
      const page = await fetchHTML(url);

      // country name
      const nameMatch = page.match(/<h1[^>]*>(.*?)<\/h1>/);
      const country = nameMatch ? nameMatch[1].replace(/<\/?[^>]+(>|$)/g, "").trim() : null;

      const levelMatch = page.match(/Level\s?[1-4]/i);
      const level = levelFromText(levelMatch ? levelMatch[0] : "");

      if (country && level) {
        risk[country] = level;
        console.log(`✔ ${country}: ${level}`);
      }

    } catch (e) {
      console.log("failed:", link);
    }
  }

  return risk;
}

async function run() {

  try {
    const risk = await scrapeAdvisories();

    fs.writeFileSync(
      "./data/risk.json",
      JSON.stringify(risk, null, 2)
    );

    console.log("✅ DONE:", Object.keys(risk).length, "countries");

  } catch (e) {
    console.error("❌ scraper failed:", e);
  }
}

run();
