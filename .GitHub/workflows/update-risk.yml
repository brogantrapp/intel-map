import fs from "fs";

// =========================
// SOURCES
// =========================

// 1) Stable world country list (GeoJSON)
const COUNTRIES_URL =
  "https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json";

// 2) (TEMP RELIABLE SOURCE)
// Replace this later with State Dept parser or API
// Format: country name → level (1–4)
const advisorySource = {
  "Russia": 4,
  "Ukraine": 4,
  "Iran": 4,
  "China": 3,
  "Mexico": 3,
  "India": 2,
  "Brazil": 2,
  "France": 1,
  "Germany": 1,
  "United Kingdom": 1,
  "Japan": 1,
  "Canada": 1
};


// =========================
// NORMALIZER
// =========================

function norm(s) {
  return (s || "").toLowerCase().trim();
}


// =========================
// FETCH COUNTRIES
// =========================

async function getCountries() {
  const res = await fetch(COUNTRIES_URL);
  const geo = await res.json();
  return geo.features.map(f => f.properties.name);
}


// =========================
// BUILD RISK MAP (IMPORTANT FIX)
// =========================

async function buildRiskMap() {

  const countries = await getCountries();

  const risk = {};

  // STEP 1: default EVERY country to safe (1)
  for (const c of countries) {
    risk[c] = 1;
  }

  // STEP 2: apply overrides
  for (const [name, level] of Object.entries(advisorySource)) {

    // try direct match
    let match = countries.find(c => norm(c) === norm(name));

    if (match) {
      risk[match] = level;
    } else {
      console.log("⚠️ No match for:", name);
    }
  }

  return risk;
}


// =========================
// SAVE FILE
// =========================

async function run() {

  try {
    const risk = await buildRiskMap();

    fs.writeFileSync(
      "./data/risk.json",
      JSON.stringify(risk, null, 2)
    );

    console.log("✅ risk.json generated with", Object.keys(risk).length, "countries");

  } catch (e) {
    console.error("❌ Scraper failed:", e);
  }
}

run();
