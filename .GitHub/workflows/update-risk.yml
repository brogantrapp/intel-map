name: Build Global Risk Map (Auto Full World)

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build full world risk map
        run: |
          node -e "
          const fs = require('fs');

          // -----------------------------
          // 1. LOAD REAL WORLD MAP (ALL COUNTRIES)
          // -----------------------------
          const geo = await fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(r => r.json());

          const features = geo.features;

          const risk = {};

          // EVERY COUNTRY GETS DEFAULT VALUE (THIS FIXES YOUR PROBLEM)
          for (const f of features) {
            const name = f.properties.name;
            if (name) risk[name] = 1;
          }

          console.log('Countries loaded:', Object.keys(risk).length);

          // -----------------------------
          // 2. LOAD STATE DEPT DATA
          // -----------------------------
          let raw = {};

          try {
            raw = JSON.parse(fs.readFileSync('raw.json', 'utf8'));
          } catch (e) {
            console.log('State Dept load failed');
          }

          const list =
            raw.data ||
            raw.advisories ||
            raw.countries ||
            [];

          // -----------------------------
          // 3. APPLY OVERRIDES
          // -----------------------------
          const normalize = s => (s || '').toString().trim();

          list.forEach(item => {

            const country =
              item.country ||
              item.name ||
              item.country_name;

            const level =
              item.advisoryLevel ||
              item.level ||
              item.risk_level;

            if (!country || !level) return;

            const name = normalize(country);

            if (risk[name]) {
              risk[name] = Number(level);
            }
          });

          // -----------------------------
          // 4. SAVE FILE
          // -----------------------------
          fs.mkdirSync('data', { recursive: true });

          fs.writeFileSync(
            'data/risk.json',
            JSON.stringify(risk, null, 2)
          );

          console.log('✅ Full world risk map generated');
          "
      
      - name: Commit
        run: |
          git config --global user.name "risk-bot"
          git config --global user.email "bot@users.noreply.github.com"

          git add data/risk.json
          git commit -m "full world risk update" || echo "no changes"
          git push
