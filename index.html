<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Intel Map</title>

  <link
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- TOP BAR -->
  <div id="topbar">

    <div id="brand">
      INTEL MAP
    </div>

    <!-- SEARCH -->
    <div id="searchWrap">

      <input
        type="text"
        id="searchBox"
        placeholder="Search country..."
        autocomplete="on"
      />

    </div>

    <!-- RIGHT -->
    <div id="topRight">

      <!-- COLOR TOGGLE -->
      <label class="toggle-switch">

        <input
          type="checkbox"
          id="colorToggle"
          checked
        />

        <span class="slider"></span>

        <span class="label-text">
          Risk Colors
        </span>

      </label>

      <!-- CLOCK -->
      <div id="clockText"></div>

    </div>

  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- NEWS -->
  <div id="newsSidebar">

    <div id="newsHeader">
      GLOBAL NEWS
    </div>

    <div id="newsPanel"></div>

  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script src="app.js"></script>

</body>
</html>
